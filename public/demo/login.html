<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - UKK Penggajian (Demo)</title>
    <!-- font inter google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- css bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- icon bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card-login {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2rem;
        }
        .form-control {
            border-color: #cbd5e1;
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
        }
        .form-control:focus {
            border-color: #334155;
            box-shadow: 0 0 0 2px rgba(51, 65, 85, 0.15);
        }
        .btn-dark-custom {
            background-color: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-dark-custom:hover {
            background-color: #334155;
            border-color: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="card-login">
    <!-- judul login -->
    <div class="text-center mb-4">
        <h4 class="fw-bold text-dark mb-1 tracking-tight">UKK PENGGAJIAN</h4>
        <p class="text-muted small mb-0">Sistem Perhitungan & Cetak Slip Gaji Karyawan</p>
    </div>

    <!-- info demo -->
    <div class="alert alert-secondary py-2 px-3 small border-0 mb-4 bg-light text-secondary d-flex align-items-center gap-2">
        <i class="bi bi-info-circle fs-6"></i>
        <span>Halaman demo mandiri (tanpa server). Klik <strong>Masuk</strong> untuk langsung menuju riwayat.</span>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='riwayat.html';">
        <!-- input username -->
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0" id="username" value="admin" required placeholder="Masukkan username">
            </div>
        </div>

        <!-- input password -->
        <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-secondary">Kata Sandi</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 border-end-0" id="password" value="admin123" required placeholder="Masukkan kata sandi">
                <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="btnTogglePassword">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>

        <!-- tombol login -->
        <button type="submit" class="btn btn-dark-custom w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Sistem
        </button>
    </form>
</div>

<!-- javascript bootstrap 5 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // fungsi buat liat atau ngumpetin password
    const toggleBtn = document.getElementById('btnTogglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleBtn.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
        }
    });
</script>
</body>
</html>
